[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wa-commons"
version = "0.1.0"
description = "WA Commons evidence and identity foundations"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "cvxpy==1.9.2",
    "osqp==1.1.3",
]

[project.scripts]
wa-commons = "wa_commons.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
