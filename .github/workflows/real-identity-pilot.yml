name: real-identity-pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/wa_commons/identity/**'
      - 'scripts/run_real_identity_pilot.py'
      - 'scripts/run_real_identity_pilot_fixed.py'
      - 'pyproject.toml'
      - '.github/workflows/real-identity-pilot.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Diagnose JPX request client
        shell: bash
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          url = "https://www.jpx.co.jp/markets/statistics-equities/misc/tvdivq0000001vg2-att/data_j.xls"
          cases = [
              ("wa-fixed", {"User-Agent": "wa-commons-m1/0.1"}),
              ("urllib-default", {}),
              (
                  "browser-like",
                  {
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                      "(KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"
                  },
              ),
          ]
          for name, headers in cases:
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      resp.read(1)
                      print(name, "status", resp.status, "content-type", resp.headers.get("Content-Type"), "final-url", resp.geturl())
              except urllib.error.HTTPError as exc:
                  print(name, "status", exc.code, "content-type", exc.headers.get("Content-Type"), "final-url", exc.geturl())
              except Exception as exc:
                  print(name, "exception", type(exc).__name__, str(exc))
          PY
      - name: Run official-data 100-company pilot
        run: python scripts/run_real_identity_pilot_fixed.py artifacts/real-identity-pilot
      - name: Print report
        run: cat artifacts/real-identity-pilot/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: real-identity-pilot
          path: |
            artifacts/real-identity-pilot/report.json
            artifacts/real-identity-pilot/entities.json
          retention-days: 30
